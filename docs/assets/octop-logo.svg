  <ellipse cx="285" cy="190" rx="46" ry="70" fill="#BFE0FF" opacity="0.85" transform="rotate(-18 285 190)"/>
  <ellipse cx="322" cy="220" rx="38" ry="58" fill="#CFE8FF" opacity="0.85" transform="rotate(-12 322 220)"/>
  <!-- antennae -->
