  <!-- head -->
  <circle cx="248" cy="200" r="96" fill="#5BA3F5"/>
  <!-- eyes -->
  <circle cx="212" cy="196" r="24" fill="#1A1A1A"/>
  <circle cx="206" cy="188" r="8" fill="#fff"/>
  <circle cx="284" cy="196" r="24" fill="#1A1A1A"/>
  <circle cx="278" cy="188" r="8" fill="#fff"/>
  <!-- blush -->
  <ellipse cx="186" cy="232" rx="14" ry="9" fill="#FFB6D5" opacity="0.9"/>
  <ellipse cx="310" cy="232" rx="14" ry="9" fill="#FFB6D5" opacity="0.9"/>
  <!-- smile -->
