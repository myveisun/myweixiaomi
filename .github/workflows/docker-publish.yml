name: Docker Publish

# 仅在版本标签（v*）上构建并同步发布镜像到 Docker Hub 与 GHCR。
# 文档与对外引用统一使用：ghcr.io/myveisun/myweixiaomi
# （Hub 仍用 DOCKERHUB_* secrets 同步推送；secrets 未配置时跳过 Hub，仅推 GHCR。）
#
# 触发路径：
#   1. 人工推送 v* tag → on.push.tags
#   2. Auto Tag 用 GITHUB_TOKEN 推 tag 后显式 workflow_dispatch（token push 不会触发 push 工作流）
#
# 注意：workflow_dispatch 下 metadata-action 的 type=semver 不可靠，
# 必须从 GITHUB_REF_NAME 显式解析版本号。
#
# FnOS FPK 由 Release 成功后自动 dispatch，并等待本工作流推送的 :{version} 就绪。
#
# 拉取示例：
#   docker pull ghcr.io/myveisun/myweixiaomi:latest
#   docker pull ghcr.io/myveisun/myweixiaomi:1.2.1
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v), e.g. 1.2.0. Blank = resolve from the v* tag ref."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    # v* tag push：在 tag ref 上构建；workflow_dispatch：允许在 main 上手动补推
    # 镜像（源码固定检出到 v{version} tag，保证镜像内容与该版本发版一致）。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('v{0}', inputs.version) || '' }}

      - name: Resolve version from tag ref
        id: ver
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            ref="v${{ inputs.version }}"
          fi
          case "$ref" in
            v*)
              echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
              echo "tag=$ref" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected refs/tags/v*, got ref_name=$ref"
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect Docker Hub credentials
        id: hub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not configured — pushing to GHCR only."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: image
        run: |
          ghcr="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "images<<EOL"
            if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
              echo "${{ secrets.DOCKERHUB_USERNAME }}/weixiaomi"
            fi
            echo "$ghcr"
            echo "EOL"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 多行 GITHUB_OUTPUT：Hub 凭据缺失时列表只含 GHCR 一行
          images: ${{ steps.image.outputs.images }}
          # 显式 raw tag：兼容 push.tags 与 Auto Tag 的 workflow_dispatch
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
